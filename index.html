<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batu Gunting Kertas — Hand Battle AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="windowWrapper">
        <div id="containerWindow">
            <div id="chromeBar">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <p id="game-title">Hand Battle AI</p>
            </div>
            <div id="webcam-container" class="halfContainer" aria-label="Kamera pemain">
                <p id="playerAnswer"></p>
            </div>
            <div id="computer-container" class="halfContainer" aria-label="Pilihan komputer">AI</div>
            <button id="vs" type="button" aria-label="Mulai permainan" disabled>▶</button>
            <p id="game-status" role="status" aria-live="polite">Menghubungkan kamera...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/VbfQgzD3J/";

        let model, webcam;

        const playButton = document.querySelector("#vs");
        const gameStatus = document.querySelector("#game-status");
        const gameTitle = document.querySelector("#game-title");
        const computerContainer = document.querySelector("#computer-container");
        const playerAnswer = document.querySelector("#playerAnswer");
        const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

        playButton.addEventListener("click", playRound);
        init();

        async function init() {
            let startupStage = "library";
            try {
                if (!window.tmImage) {
                    throw new Error("Library AI gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.");
                }
                if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Kamera memerlukan halaman localhost atau HTTPS. Jalankan dengan Live Server.");
                }

                startupStage = "model";
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);

                startupStage = "camera";
                webcam = new tmImage.Webcam(300, 300, true);
                await webcam.setup();
                await webcam.play();

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                gameStatus.textContent = "Kamera siap. Tunjukkan pose tangan, lalu tekan tombol untuk bermain.";
                playButton.disabled = false;
                window.requestAnimationFrame(loop);
            } catch (error) {
                console.error("Gagal menyiapkan model atau kamera:", error);
                const errorName = error && error.name;
                if (startupStage === "library" && error && error.message) {
                    gameStatus.textContent = error.message;
                } else if (errorName === "NotAllowedError" || errorName === "SecurityError") {
                    gameStatus.textContent = "Akses kamera ditolak. Izinkan kamera untuk situs ini, lalu muat ulang halaman.";
                } else if (errorName === "NotFoundError" || errorName === "DevicesNotFoundError") {
                    gameStatus.textContent = "Kamera tidak ditemukan. Sambungkan kamera lalu muat ulang halaman.";
                } else if (errorName === "NotReadableError" || errorName === "TrackStartError") {
                    gameStatus.textContent = "Kamera sedang digunakan aplikasi lain. Tutup aplikasi tersebut lalu coba lagi.";
                } else if (startupStage === "model") {
                    gameStatus.textContent = "Model AI gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.";
                } else {
                    gameStatus.textContent = "Kamera gagal dibuka. Periksa izin kamera dan coba muat ulang halaman.";
                }
                gameTitle.textContent = "Tidak dapat memulai permainan";
            }
        }

        function loop() {
            if (!webcam) return;
            webcam.update();
            window.requestAnimationFrame(loop);
        }

        async function playRound() {
            if (!model || !webcam || playButton.disabled) return;

            playButton.disabled = true;
            computerContainer.textContent = "";
            playerAnswer.textContent = "";
            gameTitle.textContent = "Siap-siap!";

            try {
                for (const count of ["3", "2", "1"]) {
                    playButton.textContent = count;
                    gameStatus.textContent = `Tunjukkan pose tangan dalam ${count}...`;
                    await sleep(700);
                }

                gameStatus.textContent = "Membaca pose tangan...";
                const [winner, computerGuess, playerGuess] = await startGame();
                computerContainer.textContent = toIndonesian(computerGuess);
                playerAnswer.textContent = toIndonesian(playerGuess);
                gameTitle.textContent = winner === "Draw"
                    ? "Seri!"
                    : winner === "Player" ? "Kamu menang!" : "Komputer menang!";
                gameStatus.textContent = `Kamu: ${toIndonesian(playerGuess)} · Komputer: ${toIndonesian(computerGuess)}`;
            } catch (error) {
                console.error("Gagal menjalankan ronde:", error);
                gameTitle.textContent = "Ronde gagal";
                const errorMessage = error && error.message;
                gameStatus.textContent = errorMessage === "Hasil prediksi tidak valid. Muat ulang halaman dan coba lagi."
                    || errorMessage === "Pose tangan belum dikenali dengan jelas. Coba pencahayaan lebih terang dan ulangi."
                    ? errorMessage
                    : "Prediksi tidak berhasil. Periksa kamera dan coba lagi.";
            } finally {
                playButton.textContent = "▶";
                playButton.disabled = false;
            }
        }

        function toIndonesian(name) {
            switch (name) {
                case "Paper": return "KERTAS";
                case "Scissors": return "GUNTING";
                case "Rock": return "BATU";
                default: return "—";
            }
        }

        async function startGame() {
            const classNames = ["Rock", "Paper", "Scissors"];
            const computerGuess = classNames[Math.floor(Math.random() * classNames.length)];
            const sampleCount = 5;
            const probabilityTotals = Object.fromEntries(classNames.map((className) => [className, 0]));

            for (let sample = 0; sample < sampleCount; sample++) {
                const prediction = await model.predict(webcam.canvas);
                if (!Array.isArray(prediction)) {
                    throw new Error("Hasil prediksi tidak valid. Muat ulang halaman dan coba lagi.");
                }

                for (const item of prediction) {
                    if (classNames.includes(item.className) && Number.isFinite(item.probability)) {
                        probabilityTotals[item.className] += item.probability;
                    }
                }

                if (sample < sampleCount - 1) await sleep(100);
            }

            const bestPrediction = classNames
                .map((className) => ({
                    className,
                    probability: probabilityTotals[className] / sampleCount
                }))
                .reduce((best, item) => item.probability > best.probability ? item : best, {
                    className: "",
                    probability: -1
                });
            const playerGuess = bestPrediction.className;
            if (!playerGuess || bestPrediction.probability < 0.5) {
                throw new Error("Pose tangan belum dikenali dengan jelas. Coba pencahayaan lebih terang dan ulangi.");
            }
            return [checkWinner(computerGuess, playerGuess), computerGuess, playerGuess];
        }

        function checkWinner(computer, player) {
            if (computer === player) return "Draw";
            if (
                (player === "Rock" && computer === "Scissors") ||
                (player === "Paper" && computer === "Rock") ||
                (player === "Scissors" && computer === "Paper")
            ) {
                return "Player";
            }
            return "Computer";
        }

    </script>
</body>

</html>
